name: CI

# Until this runs, every claim in the README about what is proved rests on one
# machine having said so once. That is the reason this workflow exists and the
# reason it verifies from source rather than trusting anything committed.

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FSTAR_VERSION: "2026.08.09"
  Z3_VERSION: "4.13.3"
  OCAML_VERSION: "5.3.0"

jobs:
  verify:
    name: F* verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache the F* release
        id: fstar-cache
        uses: actions/cache@v4
        with:
          path: ~/toolchain
          key: fstar-${{ env.FSTAR_VERSION }}-z3-${{ env.Z3_VERSION }}

      - name: Install F* and Z3
        if: steps.fstar-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/toolchain && cd ~/toolchain
          curl -fsSL -o fstar.tar.gz \
            "https://github.com/FStarLang/FStar/releases/download/v${FSTAR_VERSION}/fstar-v${FSTAR_VERSION}-Linux-x86_64.tar.gz"
          tar -xzf fstar.tar.gz
          # The tarball's top directory has been both a versioned name and a
          # bare `fstar`, and `mv fstar* fstar` only survives the first: once
          # the archive unpacks to `fstar` the glob also catches the tarball
          # and mv is asked to move a directory into itself. Normalise
          # whichever arrived instead, which is a no-op for the bare one.
          # Same rule as tools/setup.sh, which does this for a workstation.
          find . -maxdepth 1 -type d -name 'fstar*' ! -name fstar \
            -exec mv {} fstar \;
          # ~/toolchain is what gets cached, and the tarball is 230 MB of it
          # that nothing reads again. tools/setup.sh drops it for the same
          # reason.
          rm -f fstar.tar.gz

      # `make verify` passes --report_assumes error, so every escape hatch --
      # admit, assume, magic -- is an error rather than something to remember to
      # look for. An admit otherwise verifies silently and nothing fails on it.
      - name: Verify every module, refusing proof holes
        run: |
          export PATH="$HOME/toolchain/fstar/bin:$PATH"
          fstar.exe --version
          make -C fstar verify

  build:
    name: Build, extract and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache the F* release
        id: fstar-cache
        uses: actions/cache@v4
        with:
          path: ~/toolchain
          key: fstar-${{ env.FSTAR_VERSION }}-z3-${{ env.Z3_VERSION }}

      - name: Install F* and Z3
        if: steps.fstar-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/toolchain && cd ~/toolchain
          curl -fsSL -o fstar.tar.gz \
            "https://github.com/FStarLang/FStar/releases/download/v${FSTAR_VERSION}/fstar-v${FSTAR_VERSION}-Linux-x86_64.tar.gz"
          tar -xzf fstar.tar.gz
          # The tarball's top directory has been both a versioned name and a
          # bare `fstar`, and `mv fstar* fstar` only survives the first: once
          # the archive unpacks to `fstar` the glob also catches the tarball
          # and mv is asked to move a directory into itself. Normalise
          # whichever arrived instead, which is a no-op for the bare one.
          # Same rule as tools/setup.sh, which does this for a workstation.
          find . -maxdepth 1 -type d -name 'fstar*' ! -name fstar \
            -exec mv {} fstar \;
          # ~/toolchain is what gets cached, and the tarball is 230 MB of it
          # that nothing reads again. tools/setup.sh drops it for the same
          # reason.
          rm -f fstar.tar.gz

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ env.OCAML_VERSION }}

      - name: Install dependencies
        run: opam install . --deps-only --with-test -y

      # F*'s support library ships as precompiled objects built by a
      # zstd-enabled compiler; OCaml 5.3 compresses .cmi when it can, so those
      # objects are unreadable to a compiler without it. Building them from the
      # shipped sources sidesteps the question rather than chasing the flag.
      - name: Vendor F*'s support modules
        run: |
          export PATH="$HOME/toolchain/fstar/bin:$PATH"
          opam exec -- make -C fstar fstarlib

      # The rule is that extracted OCaml is a build artifact and is never
      # hand-edited. This is what makes that enforceable instead of merely
      # stated: regenerate it, and fail if it differs from what was committed.
      - name: Extracted OCaml matches a fresh extraction
        run: |
          export PATH="$HOME/toolchain/fstar/bin:$PATH"
          opam exec -- make -C fstar extract
          if ! git diff --exit-code --stat ocaml/extracted; then
            echo "::error::ocaml/extracted differs from a fresh extraction -- it was hand-edited, or the F* source changed without re-extracting"
            exit 1
          fi

      # The step above proves extraction is DETERMINISTIC; this one checks
      # it is FAITHFUL on fixed points: the extracted binary's answers,
      # recomputed inside F*'s own evaluator from the proved source (the
      # runtime-law leg and the js/ oracle watch it from other angles). A
      # divergence on any checked value -- one band-table entry, one grid
      # cell -- fails here even though every other suite would stay green.
      - name: Extracted OCaml computes what the proved source computes
        run: |
          export PATH="$HOME/toolchain/fstar/bin:$PATH"
          opam exec -- make test-extraction
          if ! git diff --exit-code --stat fstar/check/Tessarium.Check.Expected.fst; then
            echo "::error::the committed expected values differ from what the extracted core computes"
            exit 1
          fi

      # The KaRaMeL leg: the machine-integer core is PROVED equal to the
      # spec (that proof runs in low-verify, inside this target), then the
      # emitted C replays the vectors above. What this step tests at
      # runtime, beyond the proof: F*'s .krml emission (which shares the
      # extraction pipeline's erasure and ML translation with the OCaml it
      # checks -- the evaluator leg watches that shared part), krml itself,
      # and the C compiler. No ocamlopt, no zarith.
      - name: Emitted C computes what the proved source computes
        run: |
          export PATH="$HOME/toolchain/fstar/bin:$PATH"
          opam exec -- make test-lowstar
          if ! git diff --exit-code --stat fstar/low/check_vectors.h; then
            echo "::error::the committed C vectors differ from what the extracted core computes"
            exit 1
          fi

      # The browser's half of the side-by-side story: wasm/core.wasm is
      # the same vendored C compiled by a pinned zig. Rebuild and
      # byte-diff -- the behavioural wall (js/wasm-differential.mjs, in
      # dune test) rings on live-code drift, but a byte tampered in a
      # dead region only this diff can catch. zig has its own cache
      # entry: the fstar cache key predates it and would never save it.
      - name: Cache zig
        uses: actions/cache@v4
        with:
          path: ~/toolchain/zig
          key: zig-0.13.0

      - name: Committed wasm core matches a fresh build
        run: |
          if [ ! -x ~/toolchain/zig/zig ]; then
            cd ~/toolchain
            curl -fsSL -o zig.tar.xz "https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz"
            echo "d45312e61ebcc48032b77bc4cf7fd6915c11fa16e4aad116b66c9468211230ea  zig.tar.xz" | sha256sum -c -
            tar xf zig.tar.xz && mv zig-linux-x86_64-0.13.0 zig && rm zig.tar.xz
            cd "$GITHUB_WORKSPACE"
          fi
          make sync-wasm
          if ! git diff --exit-code --stat wasm/core.wasm; then
            echo "::error::wasm/core.wasm differs from a fresh build of the vendored C -- run make sync-wasm"
            exit 1
          fi

      # The KDF's two committed artifacts: the vendored Argon2 reference C
      # must match the pinned upstream release byte for byte, and
      # wasm/argon2.wasm must match a fresh build of it (the SAME C the
      # server's FFI links -- one implementation, two hosts). The
      # behavioural wall (js/argon2-differential.mjs, in dune test) rings
      # on live-code drift; dead-region bytes only these diffs catch.
      - name: Vendored Argon2 matches the pinned release
        run: make sync-argon2

      - name: Committed Argon2 wasm matches a fresh build
        run: |
          make sync-argon2-wasm
          if ! git diff --exit-code --stat wasm/argon2.wasm; then
            echo "::error::wasm/argon2.wasm differs from a fresh build of the vendored C -- run make sync-argon2-wasm"
            exit 1
          fi

      # The side-by-side wall links a committed copy of the KaRaMeL
      # emission (ocaml/c_core/vendor; the server still links only the
      # extracted core). A hand edit or a stale copy after an F* change
      # must fail: sync rewrites the module files and diffs the pinned
      # krml headers against the toolchain, and untracked leftovers in
      # vendor/ (a new emitted module git diff cannot see) fail too.
      - name: Committed C core matches a fresh emission
        run: |
          export PATH="$HOME/toolchain/fstar/bin:$PATH"
          opam exec -- make sync-c-core
          if ! git diff --exit-code --stat ocaml/c_core/vendor \
             || [ -n "$(git status --porcelain ocaml/c_core/vendor)" ]; then
            git status --porcelain ocaml/c_core/vendor
            echo "::error::ocaml/c_core/vendor differs from a fresh KaRaMeL emission -- run make sync-c-core"
            exit 1
          fi

      # Before setup-node, which wants a package manager present to key its
      # cache on. The version comes from the `packageManager` field in
      # package.json, so CI and a developer's checkout cannot drift.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # The differential oracle's one dependency (keyed BLAKE2s -- see
      # package.json at the root). Locked install, no scripts.
      - name: Oracle dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build
        run: opam exec -- dune build

      # The dune suites, enumerated in tools/check-suites.sh, which fails if
      # any of them stops producing output.
      - name: Test
        run: opam exec -- tools/check-suites.sh

      # Copies ui/dist to ocaml/server/ui_dist, which the next build compiles
      # into the server binary.
      - name: Build the UI
        run: opam exec -- make ui

      - name: Embed the UI in the binary
        run: opam exec -- dune build

      # Lint, types, message catalogues and the browser payload budgets. After
      # the UI build because it needs ui/node_modules, and after the dune build
      # because ui/test/payload.mjs measures the bundle where dune writes it.
      # Without this step nothing in CI holds ocaml/js/dune's two size
      # settings, and deleting them would ship a 5 MB bundle to a green build.
      - name: Static checks
        run: opam exec -- make test-static

      # Through the Makefile, not by hand. The suite needs FIVE servers -- a
      # fixture archive to download from, and four clients configured
      # differently (whole-file, multi-part, compression mismatch, cancel) --
      # and it takes their URLs as arguments. Starting one server and passing
      # one URL leaves base3/base4/base5 pointing at ports nothing is
      # listening on, which is what this step used to do: every check past
      # the first download section failed on a refused connection, so the
      # resume, mismatch and cancel guarantees were not being tested at all.
      #
      # The recipe also owns the teardown. No --ui in it either, so this
      # drives the UI compiled into the binary -- what ships is what is
      # tested.
      - name: Browser end-to-end
        run: |
          cd ui && pnpm exec playwright install chromium
          cd ..
          opam exec -- make test-ui

      # Every package ships a world overview and the glyphs its labels are
      # drawn from, so packaging needs a map to cut one out of. Kept outside
      # the tree and cached under a fixed key: it is 21 MB of somebody else's
      # bandwidth, it changes upstream every day, and a package built from a
      # different day's planet is a different package for no reason anyone
      # asked for.
      - name: Cache the map packages ship
        id: mapsrc-cache
        uses: actions/cache@v4
        with:
          path: ~/mapsrc
          key: mapsrc-world4-v1

      - name: Fetch the map packages ship
        if: steps.mapsrc-cache.outputs.cache-hit != 'true'
        run: opam exec -- tools/fetch-basemap.sh -o "$HOME/mapsrc" -z "" -W 4

      - name: Package
        run: |
          export WORLD_SOURCE="$HOME/mapsrc/world.pmtiles"
          export ASSETS_DIR="$HOME/mapsrc"
          opam exec -- tools/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: tessarium-linux-x86_64
          path: dist/*.tar.gz

  # The first rung of "verifiable builds" (roadmap, Phase 7): the same commit
  # built twice from clean must yield bit-identical release artifacts. The
  # tarball and .deb are built with fixed timestamps and ownership, so any
  # difference here is nondeterminism creeping into the pipeline -- the thing
  # that would make published checksums unverifiable.
  reproducible:
    name: Packages build twice identically, and install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache the F* release
        id: fstar-cache
        uses: actions/cache@v4
        with:
          path: ~/toolchain
          key: fstar-${{ env.FSTAR_VERSION }}-z3-${{ env.Z3_VERSION }}

      - name: Install F* and Z3
        if: steps.fstar-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/toolchain && cd ~/toolchain
          curl -fsSL -o fstar.tar.gz \
            "https://github.com/FStarLang/FStar/releases/download/v${FSTAR_VERSION}/fstar-v${FSTAR_VERSION}-Linux-x86_64.tar.gz"
          tar -xzf fstar.tar.gz
          # The tarball's top directory has been both a versioned name and a
          # bare `fstar`, and `mv fstar* fstar` only survives the first: once
          # the archive unpacks to `fstar` the glob also catches the tarball
          # and mv is asked to move a directory into itself. Normalise
          # whichever arrived instead, which is a no-op for the bare one.
          # Same rule as tools/setup.sh, which does this for a workstation.
          find . -maxdepth 1 -type d -name 'fstar*' ! -name fstar \
            -exec mv {} fstar \;
          # ~/toolchain is what gets cached, and the tarball is 230 MB of it
          # that nothing reads again. tools/setup.sh drops it for the same
          # reason.
          rm -f fstar.tar.gz

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ env.OCAML_VERSION }}

      - name: Install dependencies
        run: opam install . --deps-only --with-test -y

      - name: Vendor F*'s support modules
        run: |
          export PATH="$HOME/toolchain/fstar/bin:$PATH"
          opam exec -- make -C fstar fstarlib

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # rpmbuild, and the two things rpm needs to recognise a binary as ELF:
      # without file(1) and its magic database rpm builds a package that
      # declares no library dependencies at all, which package-rpm.sh now
      # refuses to hand over.
      - name: Install rpm build tools
        run: sudo apt-get update && sudo apt-get install -y rpm file

      # Outside the working tree on purpose: `git clean` below wipes
      # basemap/, and both builds have to cut their world overview out of
      # the SAME source archive or the two packages differ over a map that
      # changed upstream between them rather than over anything this
      # repository did.
      - name: Cache the map packages ship
        id: mapsrc-cache
        uses: actions/cache@v4
        with:
          path: ~/mapsrc
          key: mapsrc-world4-v1

      - name: Fetch the map packages ship
        if: steps.mapsrc-cache.outputs.cache-hit != 'true'
        run: opam exec -- tools/fetch-basemap.sh -o "$HOME/mapsrc" -z "" -W 4

      - name: Build and package twice from clean, compare
        run: |
          export PATH="$HOME/toolchain/fstar/bin:$PATH"
          export WORLD_SOURCE="$HOME/mapsrc/world.pmtiles"
          export ASSETS_DIR="$HOME/mapsrc"
          build_all() {
            opam exec -- dune build
            opam exec -- make ui
            opam exec -- dune build
            opam exec -- tools/package.sh
            opam exec -- tools/package-deb.sh
            opam exec -- tools/package-rpm.sh
          }
          build_all
          sha256sum dist/*.tar.gz dist/*.deb dist/*.rpm > /tmp/first.sum
          cat /tmp/first.sum
          # -e _opam: the local switch is the toolchain, not build output.
          # -e ocaml/fstarlib: vendored once above; cleaning it would make
          # the second build fail on Unbound module Prims.
          git clean -xfd -e _opam -e ocaml/fstarlib
          build_all
          sha256sum dist/*.tar.gz dist/*.deb dist/*.rpm > /tmp/second.sum
          cat /tmp/second.sum
          diff /tmp/first.sum /tmp/second.sum
          echo "bit-identical across clean builds"

      # Here rather than in its own job because this is the only job that
      # produces packages, and the toolchain needed to produce them is ten
      # minutes of setup that would otherwise be paid twice.
      - name: Install the packages and run them
        run: opam exec -- tools/test-install.sh
