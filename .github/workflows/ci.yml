name: CI

# Until this runs, every claim in the README about what is proved rests on one
# machine having said so once. That is the reason this workflow exists and the
# reason it verifies from source rather than trusting anything committed.

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FSTAR_VERSION: "2026.08.09"
  Z3_VERSION: "4.13.3"
  OCAML_VERSION: "5.3.0"

jobs:
  verify:
    name: F* verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache the F* release
        id: fstar-cache
        uses: actions/cache@v4
        with:
          path: ~/toolchain
          key: fstar-${{ env.FSTAR_VERSION }}-z3-${{ env.Z3_VERSION }}

      - name: Install F* and Z3
        if: steps.fstar-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/toolchain && cd ~/toolchain
          curl -fsSL -o fstar.tar.gz \
            "https://github.com/FStarLang/FStar/releases/download/v${FSTAR_VERSION}/fstar-v${FSTAR_VERSION}-Linux-x86_64.tar.gz"
          tar -xzf fstar.tar.gz && mv fstar* fstar

      # `make verify` passes --report_assumes error, so every escape hatch --
      # admit, assume, magic -- is an error rather than something to remember to
      # look for. An admit otherwise verifies silently and nothing fails on it.
      - name: Verify every module, refusing proof holes
        run: |
          export PATH="$HOME/toolchain/fstar/bin:$PATH"
          fstar.exe --version
          make -C fstar verify

  build:
    name: Build, extract and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache the F* release
        id: fstar-cache
        uses: actions/cache@v4
        with:
          path: ~/toolchain
          key: fstar-${{ env.FSTAR_VERSION }}-z3-${{ env.Z3_VERSION }}

      - name: Install F* and Z3
        if: steps.fstar-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/toolchain && cd ~/toolchain
          curl -fsSL -o fstar.tar.gz \
            "https://github.com/FStarLang/FStar/releases/download/v${FSTAR_VERSION}/fstar-v${FSTAR_VERSION}-Linux-x86_64.tar.gz"
          tar -xzf fstar.tar.gz && mv fstar* fstar

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ env.OCAML_VERSION }}

      - name: Install dependencies
        run: opam install . --deps-only --with-test -y

      # F*'s support library ships as precompiled objects built by a
      # zstd-enabled compiler; OCaml 5.3 compresses .cmi when it can, so those
      # objects are unreadable to a compiler without it. Building them from the
      # shipped sources sidesteps the question rather than chasing the flag.
      - name: Vendor F*'s support modules
        run: |
          export PATH="$HOME/toolchain/fstar/bin:$PATH"
          opam exec -- make -C fstar fstarlib

      # The rule is that extracted OCaml is a build artifact and is never
      # hand-edited. This is what makes that enforceable instead of merely
      # stated: regenerate it, and fail if it differs from what was committed.
      - name: Extracted OCaml matches a fresh extraction
        run: |
          export PATH="$HOME/toolchain/fstar/bin:$PATH"
          opam exec -- make -C fstar extract
          if ! git diff --exit-code --stat ocaml/extracted; then
            echo "::error::ocaml/extracted differs from a fresh extraction -- it was hand-edited, or the F* source changed without re-extracting"
            exit 1
          fi

      # The step above proves extraction is DETERMINISTIC; this one is the
      # only check that it is FAITHFUL: the extracted binary's answers,
      # recomputed inside F*'s own evaluator from the proved source. A
      # divergence on any checked value -- one band-table entry, one grid
      # cell -- fails here even though every other suite would stay green.
      - name: Extracted OCaml computes what the proved source computes
        run: |
          export PATH="$HOME/toolchain/fstar/bin:$PATH"
          opam exec -- make test-extraction
          if ! git diff --exit-code --stat fstar/check/Tessarium.Check.Expected.fst; then
            echo "::error::the committed expected values differ from what the extracted core computes"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Build
        run: opam exec -- dune build

      # Six suites: native vectors, the js_of_ocaml artifact against the same
      # vectors, the independently written JS implementation, the server's pure
      # decisions, the PMTiles round-trip, and a check that the verified core
      # still reproduces vectors.json from inputs.json.
      # check-suites.sh rather than dune directly: dune reports a suite that
      # fails, but not one that produced no output because its rule got cached.
      - name: Test
        run: opam exec -- tools/check-suites.sh

      # Copies ui/dist to ocaml/server/ui_dist, which the next build compiles
      # into the server binary.
      - name: Build the UI
        run: opam exec -- make ui

      - name: Embed the UI in the binary
        run: opam exec -- dune build

      # No --ui, so this drives the UI compiled into the binary rather than a
      # directory beside it. That is what ships, so that is what is tested.
      - name: Browser end-to-end
        run: |
          cd ui && npx playwright install chromium
          cd ..
          mkdir -p basemap
          opam exec -- ./_build/default/ocaml/server/bin/main.exe \
            --port 7373 --basemap basemap --no-open &
          for i in $(seq 40); do
            curl -sf -o /dev/null http://127.0.0.1:7373/healthz && break
            sleep 0.25
          done
          cd ui && node test/e2e.mjs http://127.0.0.1:7373

      - name: Package
        run: opam exec -- tools/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: tessarium-linux-x86_64
          path: dist/*.tar.gz

  # The first rung of "verifiable builds" (roadmap, Phase 7): the same commit
  # built twice from clean must yield bit-identical release artifacts. The
  # tarball and .deb are built with fixed timestamps and ownership, so any
  # difference here is nondeterminism creeping into the pipeline -- the thing
  # that would make published checksums unverifiable.
  reproducible:
    name: Double-build reproducibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache the F* release
        id: fstar-cache
        uses: actions/cache@v4
        with:
          path: ~/toolchain
          key: fstar-${{ env.FSTAR_VERSION }}-z3-${{ env.Z3_VERSION }}

      - name: Install F* and Z3
        if: steps.fstar-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/toolchain && cd ~/toolchain
          curl -fsSL -o fstar.tar.gz \
            "https://github.com/FStarLang/FStar/releases/download/v${FSTAR_VERSION}/fstar-v${FSTAR_VERSION}-Linux-x86_64.tar.gz"
          tar -xzf fstar.tar.gz && mv fstar* fstar

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ env.OCAML_VERSION }}

      - name: Install dependencies
        run: opam install . --deps-only --with-test -y

      - name: Vendor F*'s support modules
        run: |
          export PATH="$HOME/toolchain/fstar/bin:$PATH"
          opam exec -- make -C fstar fstarlib

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Build and package twice from clean, compare
        run: |
          export PATH="$HOME/toolchain/fstar/bin:$PATH"
          build_all() {
            opam exec -- dune build
            opam exec -- make ui
            opam exec -- dune build
            opam exec -- tools/package.sh
            opam exec -- tools/package-deb.sh
          }
          build_all
          sha256sum dist/*.tar.gz dist/*.deb > /tmp/first.sum
          cat /tmp/first.sum
          # -e _opam: the local switch is the toolchain, not build output.
          # -e ocaml/fstarlib: vendored once above; cleaning it would make
          # the second build fail on Unbound module Prims.
          git clean -xfd -e _opam -e ocaml/fstarlib
          build_all
          sha256sum dist/*.tar.gz dist/*.deb > /tmp/second.sum
          cat /tmp/second.sum
          diff /tmp/first.sum /tmp/second.sum
          echo "bit-identical across clean builds"
