name: CI

# Verifies from source, so the README's claims do not rest on one machine
# having said so once.

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FSTAR_VERSION: "2026.08.09"
  Z3_VERSION: "4.13.3"
  OCAML_VERSION: "5.3.0"

jobs:
  verify:
    name: F* verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `-notar`: entries under the old key still hold the 230 MB tarball, and
      # the step that drops it runs only on a miss. Retiring them means changing
      # the key, in all three jobs.
      - name: Cache the F* release
        id: fstar-cache
        uses: actions/cache@v4
        with:
          path: ~/toolchain
          key: fstar-${{ env.FSTAR_VERSION }}-z3-${{ env.Z3_VERSION }}-notar

      # The script, not a copy: this was written out three times here and once
      # in tools/setup.sh, and the `mv fstar*` fix had to land in all of them.
      - name: Install F* and Z3
        if: steps.fstar-cache.outputs.cache-hit != 'true'
        run: tools/fetch-fstar.sh "$FSTAR_VERSION"

      # --report_assumes error: an admit is a failure here rather than
      # something to remember to look for.
      - name: Verify every module, refusing proof holes
        run: |
          export PATH="$HOME/toolchain/fstar/bin:$PATH"
          fstar.exe --version
          make -C fstar verify

  build:
    name: Build, extract and test
    # Pinned, NOT latest: a binary takes the glibc floor of whatever built it.
    # 22.04 is 2.35, the floor this project declares; latest moved to 2.39.
    # Moving this forward drops every user below the new base.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # Same key as the verify job, `-notar` included -- see the note there.
      - name: Cache the F* release
        id: fstar-cache
        uses: actions/cache@v4
        with:
          path: ~/toolchain
          key: fstar-${{ env.FSTAR_VERSION }}-z3-${{ env.Z3_VERSION }}-notar

      # The script, not a copy: this was written out three times here and once
      # in tools/setup.sh, and the `mv fstar*` fix had to land in all of them.
      - name: Install F* and Z3
        if: steps.fstar-cache.outputs.cache-hit != 'true'
        run: tools/fetch-fstar.sh "$FSTAR_VERSION"

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ env.OCAML_VERSION }}

      - name: Install dependencies
        run: opam install . --deps-only --with-test -y

      # Deliberately not in tessarium.opam: it is the tool check-deps.sh audits
      # that file WITH. Without this line the guard runs only on workstations,
      # the one place the failure it catches cannot happen.
      - name: Install the dependency-declaration linter
        run: opam install opam-dune-lint -y

      # F*'s precompiled objects need a zstd-enabled compiler to read them.
      # Building from the shipped sources sidesteps the question.
      - name: Vendor F*'s support modules
        run: |
          export PATH="$HOME/toolchain/fstar/bin:$PATH"
          opam exec -- make -C fstar fstarlib

      # Extracted OCaml is a build artifact, never hand-edited. Enforced by
      # regenerating it and failing on a diff.
      - name: Extracted OCaml matches a fresh extraction
        run: |
          export PATH="$HOME/toolchain/fstar/bin:$PATH"
          opam exec -- make -C fstar extract
          if ! git diff --exit-code --stat ocaml/extracted; then
            echo "::error::ocaml/extracted differs from a fresh extraction -- it was hand-edited, or the F* source changed without re-extracting"
            exit 1
          fi

      # The step above proves extraction DETERMINISTIC; this one proves it
      # FAITHFUL, recomputing the answers inside F*'s own evaluator. A single
      # divergent value fails here while every other suite stays green.
      - name: Extracted OCaml computes what the proved source computes
        run: |
          export PATH="$HOME/toolchain/fstar/bin:$PATH"
          opam exec -- make test-extraction
          if ! git diff --exit-code --stat fstar/check/Tessarium.Check.Expected.fst; then
            echo "::error::the committed expected values differ from what the extracted core computes"
            exit 1
          fi

      # The KaRaMeL leg: the machine-integer core is proved equal to the spec,
      # then the emitted C replays the vectors. Beyond the proof this exercises
      # .krml emission, krml itself and the C compiler. No ocamlopt, no zarith.
      - name: Emitted C computes what the proved source computes
        run: |
          export PATH="$HOME/toolchain/fstar/bin:$PATH"
          opam exec -- make test-lowstar
          if ! git diff --exit-code --stat fstar/low/check_vectors.h; then
            echo "::error::the committed C vectors differ from what the extracted core computes"
            exit 1
          fi

      # The browser's half: the same vendored C, compiled by a pinned zig. The
      # behavioural wall catches live-code drift; only this byte-diff catches a
      # tampered dead region. zig caches separately -- the fstar key predates it.
      - name: Cache zig
        uses: actions/cache@v4
        with:
          path: ~/toolchain/zig
          key: zig-0.13.0

      - name: Committed wasm core matches a fresh build
        run: |
          if [ ! -x ~/toolchain/zig/zig ]; then
            cd ~/toolchain
            curl -fsSL -o zig.tar.xz "https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz"
            echo "d45312e61ebcc48032b77bc4cf7fd6915c11fa16e4aad116b66c9468211230ea  zig.tar.xz" | sha256sum -c -
            tar xf zig.tar.xz && mv zig-linux-x86_64-0.13.0 zig && rm zig.tar.xz
            cd "$GITHUB_WORKSPACE"
          fi
          make sync-wasm
          if ! git diff --exit-code --stat wasm/core.wasm; then
            echo "::error::wasm/core.wasm differs from a fresh build of the vendored C -- run make sync-wasm"
            exit 1
          fi

      # The KDF's two artifacts: the vendored C matches the pinned release, and
      # the wasm matches a fresh build of it -- the same C the server's FFI
      # links. Dead-region bytes only these diffs catch.
      - name: Vendored Argon2 matches the pinned release
        run: make sync-argon2

      - name: Committed Argon2 wasm matches a fresh build
        run: |
          make sync-argon2-wasm
          if ! git diff --exit-code --stat wasm/argon2.wasm; then
            echo "::error::wasm/argon2.wasm differs from a fresh build of the vendored C -- run make sync-argon2-wasm"
            exit 1
          fi

      # The side-by-side wall links a committed KaRaMeL emission. A hand edit,
      # a stale copy after an F* change, and an untracked leftover module must
      # all fail -- hence the porcelain check beside the diff.
      - name: Committed C core matches a fresh emission
        run: |
          export PATH="$HOME/toolchain/fstar/bin:$PATH"
          opam exec -- make sync-c-core
          if ! git diff --exit-code --stat ocaml/c_core/vendor \
             || [ -n "$(git status --porcelain ocaml/c_core/vendor)" ]; then
            git status --porcelain ocaml/c_core/vendor
            echo "::error::ocaml/c_core/vendor differs from a fresh KaRaMeL emission -- run make sync-c-core"
            exit 1
          fi

      # Before setup-node, which wants a package manager present to key its
      # cache on. Version comes from package.json's `packageManager`.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # The differential oracle's one dependency. Locked install, no scripts.
      - name: Oracle dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build
        run: opam exec -- dune build

      # Through the Makefile, not by restating what it runs: CI used to call
      # one of these checks by hand, so the dependency guard ran nowhere that
      # mattered. A check added to that target is now a check CI runs.
      - name: Test
        run: opam exec -- make test-core

      # Copies ui/dist to ocaml/server/ui_dist for the next build to embed.
      - name: Build the UI
        run: opam exec -- make ui

      - name: Embed the UI in the binary
        run: opam exec -- dune build

      # Lint, types, catalogues and payload budgets. After both builds: it
      # needs ui/node_modules, and payload.mjs measures the bundle where dune
      # writes it. Nothing else in CI holds ocaml/js/dune's size settings.
      - name: Static checks
        run: opam exec -- make test-static

      # Through the Makefile: the suite needs FIVE servers and their URLs, and
      # starting one leaves the resume, mismatch and cancel checks failing on
      # refused connections. The recipe owns the teardown, and passes no --ui,
      # so this drives the UI compiled into the binary.
      - name: Browser end-to-end
        run: |
          cd ui && pnpm exec playwright install chromium
          cd ..
          opam exec -- make test-ui

      # Packaging needs a map to cut an overview and glyphs out of. Cached
      # under a fixed key: 21 MB of somebody else's bandwidth that changes
      # upstream daily, and a different day's planet is a different package.
      - name: Cache the map packages ship
        id: mapsrc-cache
        uses: actions/cache@v4
        with:
          path: ~/mapsrc
          key: mapsrc-world4-v1

      - name: Fetch the map packages ship
        if: steps.mapsrc-cache.outputs.cache-hit != 'true'
        run: opam exec -- tools/fetch-basemap.sh -o "$HOME/mapsrc" -z "" -W 4

      - name: Package
        run: |
          export WORLD_SOURCE="$HOME/mapsrc/world.pmtiles"
          export ASSETS_DIR="$HOME/mapsrc"
          opam exec -- tools/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: tessarium-linux-x86_64
          path: dist/*.tar.gz

  # First rung of verifiable builds (roadmap, Phase 7): the same commit built
  # twice from clean must be bit-identical. Timestamps and ownership are fixed,
  # so a difference here is nondeterminism, and unverifiable checksums.
  reproducible:
    name: Packages build twice identically, and install
    # Same base as the build job, for the same reason: these packages carry
    # the glibc floor of their build host. See there.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # Same key as the verify job, `-notar` included -- see the note there.
      - name: Cache the F* release
        id: fstar-cache
        uses: actions/cache@v4
        with:
          path: ~/toolchain
          key: fstar-${{ env.FSTAR_VERSION }}-z3-${{ env.Z3_VERSION }}-notar

      # The script, not a copy: this was written out three times here and once
      # in tools/setup.sh, and the `mv fstar*` fix had to land in all of them.
      - name: Install F* and Z3
        if: steps.fstar-cache.outputs.cache-hit != 'true'
        run: tools/fetch-fstar.sh "$FSTAR_VERSION"

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ env.OCAML_VERSION }}

      - name: Install dependencies
        run: opam install . --deps-only --with-test -y

      - name: Vendor F*'s support modules
        run: |
          export PATH="$HOME/toolchain/fstar/bin:$PATH"
          opam exec -- make -C fstar fstarlib

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # rpmbuild, plus file(1) and its magic database: without them rpm
      # declares no library dependencies and package-rpm.sh refuses the result.
      - name: Install rpm build tools
        run: sudo apt-get update && sudo apt-get install -y rpm file

      # Outside the tree on purpose: `git clean` below wipes basemap/, and both
      # builds must cut from the SAME archive or they differ over the map
      # rather than over anything this repository did.
      - name: Cache the map packages ship
        id: mapsrc-cache
        uses: actions/cache@v4
        with:
          path: ~/mapsrc
          key: mapsrc-world4-v1

      - name: Fetch the map packages ship
        if: steps.mapsrc-cache.outputs.cache-hit != 'true'
        run: opam exec -- tools/fetch-basemap.sh -o "$HOME/mapsrc" -z "" -W 4

      - name: Build and package twice from clean, compare
        run: |
          export PATH="$HOME/toolchain/fstar/bin:$PATH"
          export WORLD_SOURCE="$HOME/mapsrc/world.pmtiles"
          export ASSETS_DIR="$HOME/mapsrc"
          build_all() {
            opam exec -- dune build
            opam exec -- make ui
            opam exec -- dune build
            opam exec -- tools/package.sh
            opam exec -- tools/package-deb.sh
            opam exec -- tools/package-rpm.sh
          }
          build_all
          sha256sum dist/*.tar.gz dist/*.deb dist/*.rpm > /tmp/first.sum
          cat /tmp/first.sum
          # -e _opam: the switch is toolchain, not build output.
          # -e ocaml/fstarlib: vendored above; cleaning it fails the second
          # build on Unbound module Prims.
          git clean -xfd -e _opam -e ocaml/fstarlib
          build_all
          sha256sum dist/*.tar.gz dist/*.deb dist/*.rpm > /tmp/second.sum
          cat /tmp/second.sum
          diff /tmp/first.sum /tmp/second.sum
          echo "bit-identical across clean builds"

      # Here rather than its own job: this is the only job that produces
      # packages, and the toolchain for them is ten minutes of setup.
      - name: Install the packages and run them
        run: opam exec -- tools/test-install.sh
