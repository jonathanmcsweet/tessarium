  <g fill="#f4f6f8">
    <rect x="88" y="88" width="100" height="100" rx="18"/>
    <rect x="206" y="88" width="100" height="100" rx="18"/>
    <rect x="324" y="88" width="100" height="100" rx="18"/>
    <rect x="88" y="206" width="100" height="100" rx="18"/>
    <rect x="324" y="206" width="100" height="100" rx="18"/>
    <rect x="88" y="324" width="100" height="100" rx="18"/>
    <rect x="206" y="324" width="100" height="100" rx="18"/>
    <rect x="324" y="324" width="100" height="100" rx="18"/>
  </g>
  <rect x="206" y="206" width="100" height="100" rx="18" fill="#e8452c"/>
</svg>
